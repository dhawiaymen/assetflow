[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "assetflow"
version = "0.1.0"
description = "AssetFlow: open tools for small game developers"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "dhawiaymen"}]
dependencies = ["Pillow>=11.3,<14"]
classifiers = ["Development Status :: 3 - Alpha", "Operating System :: Microsoft :: Windows", "Programming Language :: Python :: 3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1,<2", "pyinstaller>=6,<7"]

[project.scripts]
assetflow = "assetflow.cli:main"

[project.gui-scripts]
assetflow-gui = "assetflow.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
assetflow = ["templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["browser: requires installed Playwright Chromium", "gui: requires a display"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
