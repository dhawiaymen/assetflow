name: Tests and Windows build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -c constraints-release.txt ".[dev]"
      - run: python -m ruff check .
      - name: Tests with native Windows display
        if: runner.os == 'Windows'
        run: python -m pytest --junitxml=test-results.xml
      - name: Tests with Linux display
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest --junitxml=test-results.xml
      - run: python -m build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.os }}-${{ matrix.python }}
          path: test-results.xml
  windows-build:
    timeout-minutes: 30
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: ./scripts/build_windows.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: verified-windows-distribution
          path: release-assets/*
          if-no-files-found: error
  release:
    # Explicit one-time release request, only after all native checks pass.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release v0.1.0]')
    needs: [test, windows-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: verified-windows-distribution
          path: release-assets
      - name: Verify checksums from tested build
        working-directory: release-assets
        run: sha256sum -c SHA256SUMS.txt
      - name: Publish verified initial release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0 >/dev/null 2>&1; then
            echo "Release v0.1.0 already exists; refusing to replace it."
            exit 1
          fi
          gh release create v0.1.0 release-assets/* --target "$GITHUB_SHA" --title "AssetFlow v0.1.0" --notes-file docs/RELEASE_NOTES.md
