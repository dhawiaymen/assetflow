name: Feature proposal
description: Describe a real workflow and a bounded improvement
title: "[Proposal] "
body:
  - type: textarea
    id: workflow
    attributes:
      label: What developer task are you trying to complete?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Proposed behavior and a concrete example
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Current workaround and tradeoffs
